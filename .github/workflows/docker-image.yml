name: Build mdk4 for Phicomm K2P
on: [push]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Get mdk4 binary for K2P
        run: |
          mkdir work && cd work
          # نحمل النسخة الرسمية المتوافقة مع معالج mt7621 mipsel_24kc
          wget https://downloads.openwrt.org/releases/23.05.5/packages/mipsel_24kc/packages/mdk4_4.2-3_mipsel_24kc.ipk
          tar -xzf mdk4_*.ipk
          tar -xzf data.tar.gz
          ls -lh./usr/bin/mdk4
          file./usr/bin/mdk4
          cp./usr/bin/mdk4../mdk4-K2P-ready
          chmod +x../mdk4-K2P-ready
          cd..
          ls -lh mdk4-K2P-ready

      - name: Upload ready binary
        uses: actions/upload-artifact@v4
        with:
          name: mdk4-K2P-READY
          path: mdk4-K2P-ready
