name: Build mdk4 for Phicomm K2P - OpenWrt 25.12.4

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gettext \
            libncurses-dev \
            gawk \
            python3 \
            rsync \
            unzip \
            zlib1g-dev \
            libssl-dev \
            wget \
            zstd \
            file \
            binutils

      - name: Download OpenWrt 25.12.4 SDK
        run: |
          wget -O sdk.tar.zst \
            https://downloads.openwrt.org/releases/25.12.4/targets/ramips/mt7621/openwrt-sdk-25.12.4-ramips-mt7621_gcc-14.3.0_musl.Linux-x86_64.tar.zst

          tar --zstd -xf sdk.tar.zst

          SDK_DIR=$(find . -maxdepth 1 -type d -name 'openwrt-sdk-*' | head -n1)

          echo "SDK_DIR=$SDK_DIR" >> "$GITHUB_ENV"

      - name: Prepare SDK Feeds (Fast mode)
        run: |
          cd "$SDK_DIR"
          # تخطي التحديثات الثقيلة والاكتفاء بتحديث حزم الشبكة فقط لتوفير الوقت
          ./scripts/feeds update packages
          ./scripts/feeds install libnl-core libnl-genl libpcap

      - name: Create mdk4 package
        run: |
          cd "$SDK_DIR"

          mkdir -p package/mdk4

          cat > package/mdk4/Makefile <<'EOF'
          include $(TOPDIR)/rules.mk

          PKG_NAME:=mdk4
          PKG_VERSION:=4.2
          PKG_RELEASE:=1

          PKG_SOURCE_PROTO:=git
          PKG_SOURCE_URL:=https://github.com/aircrack-ng/mdk4.git
          PKG_SOURCE_VERSION:=v4.2
          PKG_MIRROR_HASH:=skip

          PKG_LICENSE:=GPL-3.0-or-later
          PKG_LICENSE_FILES:=LICENSE

          include $(INCLUDE_DIR)/package.mk

          define Package/mdk4
            SECTION:=net
            CATEGORY:=Network
            DEPENDS:=+libnl-core +libnl-genl +libpcap
            TITLE:=MDK4 WiFi Testing Tool
          endef

          define Package/mdk4/install
            $(INSTALL_DIR) $(1)/usr/bin
            $(INSTALL_BIN) $(PKG_BUILD_DIR)/src/mdk4 $(1)/usr/bin/mdk4
          endef

          $(eval $(call BuildPackage,mdk4))
          EOF

      - name: Build mdk4 (Single-thread & Verbose to prevent hanging)
        run: |
          cd "$SDK_DIR"
          # استخدام البناء المفرد V=s لضمان ظهور أي خطأ بوضوح وعدم تعليق السيرفر بصمت
          make package/mdk4/compile V=s -j1

      - name: Collect and Extract package
        run: |
          mkdir -p ready_binary

          find "$SDK_DIR/bin/packages" \
            -type f \
            -name 'mdk4*.ipk' \
            -exec cp {} ready_binary/ \;

          cd ready_binary
          IPK=$(find . -name 'mdk4*.ipk' | head -n1)
          
          if [ -z "$IPK" ]; then
            echo "ERROR: IPK not found!"
            exit 1
          fi

          mkdir extracted && cd extracted
          ar x "../$(basename "$IPK")"
          tar -xzf data.tar.gz || tar --zstd -xf data.tar.zst

          cp ./usr/bin/mdk4 ../../mdk4-K2P-25.12.4
          chmod +x ../../mdk4-K2P-25.12.4

      - name: Upload ready binary
        uses: actions/upload-artifact@v4
        with:
          name: mdk4-K2P-READY-25.12.4
          path: mdk4-K2P-READY-25.12.4
