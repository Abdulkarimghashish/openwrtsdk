name: Build mdk4 ipk

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Find and download OpenWrt SDK
        run: |
          echo "Finding OpenWrt SDK for ramips/mt7621..."
          SDK_BASE="https://downloads.openwrt.org/releases/23.05.3/targets/ramips/mt7621/"
          FILENAME=$(curl -s $SDK_BASE | grep -oE 'openwrt-sdk-[0-9.-]+-ramips-mt7621_[^"]+\.tar\.xz' | head -n 1)
          
          if [ -z "$FILENAME" ]; then
            echo "Trying alternative path..."
            SDK_URL="https://downloads.openwrt.org/snapshots/targets/ramips/mt7621/"
            FILENAME=$(curl -s $SDK_URL | grep -oE 'openwrt-sdk-[^"]+-ramips-mt7621_[^"]+\.tar\.xz' | head -n 1)
            FULL_URL="${SDK_URL}${FILENAME}"
          else
            FULL_URL="${SDK_BASE}${FILENAME}"
          fi
          
          echo "Downloading from: $FULL_URL"
          curl -o sdk.tar.xz "$FULL_URL"

      - name: Extract SDK
        run: |
          mkdir sdk
          tar -xf sdk.tar.xz -C sdk --strip-components=1
          rm sdk.tar.xz

      - name: Copy package into SDK
        run: |
          mkdir -p sdk/package/mdk4
          cp -r * sdk/package/mdk4/ 2>/dev/null || true
          rm -rf sdk/package/mdk4/.git sdk/package/mdk4/.github sdk/package/mdk4/sdk

      - name: Build package
        run: |
          cd sdk
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          make defconfig
          make package/mdk4/compile V=99

      - name: Upload resulting ipk(s)
        uses: actions/upload-artifact@v4
        with:
          name: mdk4-ipk-ramips-mt7621
          path: sdk/bin/packages/*/base/mdk4_*.ipk
